<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aniimo Items</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #23272A;
        }
        .quality-common { border-top: 4px solid #94a3b8; }
        .quality-rare { border-top: 4px solid #3b82f6; }
        .quality-epic { border-top: 4px solid #a855f7; }
        .quality-legendary { border-top: 4px solid #f59e0b; }
        
        .badge-common { background-color: #f1f5f9; color: #475569; }
        .badge-rare { background-color: #dbeafe; color: #1d4ed8; }
        .badge-epic { background-color: #f3e8ff; color: #6b21a8; }
        .badge-legendary { background-color: #fef3c7; color: #b45309; }
    </style>
</head>
<body class="text-slate-800 min-h-screen pb-12">

    <!-- Header Banner -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md shadow-indigo-100 flex items-center justify-center">
                    <i class="fa-solid fa-map-location-dot text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight">Aniimo Items</h1>
                    <p class="text-xs text-slate-500 font-medium">All static item locations in Aniimo</p>
                </div>
            </div>
            
            <!-- Live Workspace Stats Counter -->
            <div class="flex items-center gap-3 self-end sm:self-auto">
                <div class="flex items-center gap-3 text-xs font-medium text-slate-500 bg-slate-100 p-1.5 rounded-xl border border-slate-200">
                    <div class="px-2 py-1 bg-white rounded-md shadow-2xs"><span class="text-indigo-600 font-bold" id="stat-items">0</span> Items</div>
                    <div class="px-2 py-1 bg-white rounded-md shadow-2xs"><span class="text-emerald-600 font-bold" id="stat-spawns">0</span> Spawns</div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-6 sm:px-6 lg:px-8">
        
        <!-- Filters & Search Toolbar -->
        <div id="toolbar" class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs mb-6 flex flex-col gap-4 lg:flex-row lg:items-center">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="search-input" placeholder="Search by item name..." 
                       class="w-full pl-10 pr-4 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:bg-white text-slate-900 placeholder-slate-400 transition-all">
            </div>
            
            <div class="flex flex-wrap gap-1.5 items-center">
                <span class="text-xs font-semibold text-slate-400 mr-1 uppercase tracking-wider">Quality:</span>
                <button onclick="filterQuality('all')" id="btn-all" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-50 text-indigo-600 border border-indigo-100 shadow-2xs cursor-pointer transition-all">All</button>
                <button onclick="filterQuality('Common')" id="btn-Common" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 cursor-pointer transition-all">Common</button>
                <button onclick="filterQuality('Rare')" id="btn-Rare" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white text-blue-600 border border-slate-200 hover:bg-slate-50 cursor-pointer transition-all">Rare</button>
                <button onclick="filterQuality('Epic')" id="btn-Epic" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white text-purple-600 border border-slate-200 hover:bg-slate-50 cursor-pointer transition-all">Epic</button>
                <button onclick="filterQuality('Legendary')" id="btn-Legendary" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white text-amber-600 border border-slate-200 hover:bg-slate-50 cursor-pointer transition-all">Legendary</button>
            </div>
        </div>

        <!-- Notification Toast Panel -->
        <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-lg flex items-center space-x-2 text-xs font-medium translate-y-20 opacity-0 transition-all duration-300 z-50">
            <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
            <span id="toast-message">Value copied!</span>
        </div>

        <!-- Card Container Grid -->
        <div id="items-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        
        <!-- Empty Results Context -->
        <div id="empty-state" class="hidden text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300 mt-6">
            <i class="fa-regular fa-folder-open text-slate-300 text-4xl mb-3"></i>
            <p class="text-slate-500 font-medium text-sm">No items found matching your filters.</p>
        </div>
    </main>

    <!-- Load the externalized secondary database file first -->
    <script src="spawn_data.js"></script>

    <script>
        // Use the loaded external database or fallback safely
        let itemData = window.itemSpawnDatabase || [];
        let currentSearch = "";
        let currentQuality = "all";

        const searchInput = document.getElementById('search-input');
        const itemsGrid = document.getElementById('items-grid');
        const emptyState = document.getElementById('empty-state');

        // Process total spawns metrics automatically
        itemData.forEach(item => {
            item.total_spawns = item.coordinates ? item.coordinates.length : 0;
        });

        // Initialize Stats Banner Indicators
        document.getElementById('stat-items').innerText = itemData.length;
        document.getElementById('stat-spawns').innerText = itemData.reduce((acc, curr) => acc + curr.total_spawns, 0);

        searchInput.addEventListener('input', (e) => {
            currentSearch = e.target.value.toLowerCase().trim();
            renderGrid();
        });

        function filterQuality(quality) {
            currentQuality = quality;
            ['all', 'Common', 'Rare', 'Epic', 'Legendary'].forEach(q => {
                const btn = document.getElementById(`btn-${q}`);
                if (q === quality) {
                    btn.className = `px-3 py-1.5 text-xs font-semibold rounded-lg shadow-2xs cursor-pointer transition-all ${
                        q === 'all' ? 'bg-indigo-50 text-indigo-600 border border-indigo-100' :
                        q === 'Common' ? 'bg-slate-100 text-slate-800 border border-slate-300' :
                        q === 'Rare' ? 'bg-blue-50 text-blue-600 border border-blue-200' :
                        q === 'Epic' ? 'bg-purple-50 text-purple-600 border border-purple-200' :
                        'bg-amber-50 text-amber-600 border border-amber-200'
                    }`;
                } else {
                    btn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 cursor-pointer transition-all";
                }
            });
            renderGrid();
        }

        function copyValue(val, buttonEl, axisName) {
            navigator.clipboard.writeText(val).then(() => {
                showToast(`Copied ${axisName}: ${val}`);
                const originalBg = buttonEl.className;
                const successClass = axisName === 'X' 
                    ? "flex-1 px-2 py-1.5 bg-emerald-600 text-white border-r-2 border-emerald-700 transition-all font-bold"
                    : "flex-1 px-2 py-1.5 bg-emerald-600 text-white transition-all font-bold";
                
                buttonEl.className = successClass;
                const span = buttonEl.querySelector('span');
                if (span) span.style.display = 'none';

                setTimeout(() => {
                    buttonEl.className = originalBg;
                    if (span) span.style.display = 'inline';
                }, 800);
            });
        }

        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        function renderGrid() {
            const filtered = itemData.filter(item => {
                const matchesSearch = item.display_name.toLowerCase().includes(currentSearch);
                const matchesQuality = currentQuality === "all" || item.quality.toLowerCase() === currentQuality.toLowerCase();
                return matchesSearch && matchesQuality;
            });

            if (filtered.length === 0) {
                itemsGrid.innerHTML = "";
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            itemsGrid.innerHTML = filtered.map(item => {
                const qClass = `quality-${item.quality.toLowerCase()}`;
                const badgeClass = `badge-${item.quality.toLowerCase()}`;
                
                const labelBadge = item.inventory_label && item.inventory_label !== "General" 
                    ? `<span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[10px] font-semibold">${item.inventory_label}</span>`
                    : "";

                // High Contrast Coordinates Split Pill
                const coordsHtml = (item.coordinates || []).map(coord => {
                    return `
                        <div class="flex items-center text-xs font-mono bg-white shadow-xs rounded-xl overflow-hidden border-2 border-slate-300">
                            <button onclick="copyValue('${coord[0]}', this, 'X')" 
                                    title="Copy X Coordinate"
                                    class="flex-1 px-2 py-1.5 hover:bg-indigo-50 text-slate-900 font-semibold border-r-2 border-slate-300 cursor-pointer transition-colors text-center group">
                                <span class="text-[10px] text-slate-500 font-bold mr-1 group-hover:text-indigo-600">X:</span>${coord[0]}
                            </button>
                            <button onclick="copyValue('${coord[1]}', this, 'Y')" 
                                    title="Copy Y Coordinate"
                                    class="flex-1 px-2 py-1.5 hover:bg-indigo-50 text-slate-900 font-semibold cursor-pointer transition-colors text-center group">
                                <span class="text-[10px] text-slate-500 font-bold mr-1 group-hover:text-indigo-600">Y:</span>${coord[1]}
                            </button>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col ${qClass} transition-all hover:-translate-y-0.5 hover:shadow-md">
                        <div class="p-4 border-b border-slate-100 bg-gradient-to-b from-slate-50/50 to-white">
                            <div class="flex items-start justify-between gap-2 mb-1.5">
                                <h3 class="font-bold text-slate-900 text-base tracking-tight">${item.display_name}</h3>
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider ${badgeClass}">${item.quality}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                ${labelBadge}
                                <span class="text-slate-400 text-xs font-medium"><i class="fa-solid fa-location-crosshairs mr-1"></i>${item.total_spawns} locations</span>
                            </div>
                        </div>
                        <div class="p-4 flex-1 bg-slate-50/50 max-h-60 overflow-y-auto">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                ${coordsHtml}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        renderGrid();
    </script>
</body>
</html>
