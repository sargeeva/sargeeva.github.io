          {"display_name": "Turtleback Ore", "quality": "Rare", "inventory_label": "Home materials", "total_spawns": 24, "coordinates": [[-1453, 1023], [-1451, 1021], [-1443, 1024], [-1441, 1049], [-1375, 540], [-1374, 540], [-1366, 596], [-1365, 595], [-1363, 626], [-1309, 616], [-1240, 767], [-1167, 679], [-1156, 504], [-1155, 677], [-1108, 602], [-949, 513], [-926, 700], [-921, 706], [-895, 574], [-802, 651], [-713, 680], [-713, 683], [-626, 710], [225, -223]]}
        ];

        let currentSearch = "";
        let currentQuality = "all";

        // Initialize Global Panel Stats
        document.getElementById('stat-items').innerText = itemData.length;
        const totalSpawns = itemData.reduce((acc, curr) => acc + curr.total_spawns, 0);
        document.getElementById('stat-spawns').innerText = totalSpawns;

        // UI Targets
        const searchInput = document.getElementById('search-input');
        const itemsGrid = document.getElementById('items-grid');
        const emptyState = document.getElementById('empty-state');

        // Input Filter Hook
        searchInput.addEventListener('input', (e) => {
            currentSearch = e.target.value.toLowerCase().trim();
            renderGrid();
        });

        // Filter Grid Items by Rarity/Quality
        function filterQuality(quality) {
            currentQuality = quality;
            
            // Re-apply focus styles on toolbar controls
            ['all', 'Common', 'Rare', 'Epic', 'Legendary'].forEach(q => {
                const btn = document.getElementById(`btn-${q}`);
                if (q === quality) {
                    btn.className = `px-3 py-1.5 text-xs font-semibold rounded-lg shadow-2xs cursor-pointer transition-all ${
                        q === 'all' ? 'bg-indigo-50 text-indigo-600 border border-indigo-100' :
                        q === 'Common' ? 'bg-slate-100 text-slate-800 border border-slate-300' :
                        q === 'Rare' ? 'bg-blue-50 text-blue-600 border border-blue-200' :
                        q === 'Epic' ? 'bg-purple-50 text-purple-600 border border-purple-200' :
                        'bg-amber-50 text-amber-600 border border-amber-200'
                    }`;
                } else {
                    btn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 cursor-pointer transition-all";
                }
            });
            
            renderGrid();
        }

        // Copy Selected Coordinates to Local Clipboard
        function copyCoords(x, y, buttonEl) {
            const coordStr = `${x}, ${y}`;
            navigator.clipboard.writeText(coordStr).then(() => {
                showToast(`Copied: (${coordStr})`);
                
                // Micro-interaction flash animation on tag active click
                const originalBg = buttonEl.className;
                buttonEl.className = "px-2 py-1 text-xs font-mono bg-emerald-500 text-white rounded-lg flex items-center space-x-1 shadow-2xs transition-all";
                setTimeout(() => {
                    buttonEl.className = originalBg;
                }, 800);
            }).catch(err => {
                console.error('Failed copying context: ', err);
            });
        }

        // Render Dynamic Toast Messages
        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // Core Render Framework Loop
        function renderGrid() {
            const filtered = itemData.filter(item => {
                const matchesSearch = item.display_name.toLowerCase().includes(currentSearch);
                const matchesQuality = currentQuality === "all" || item.quality === currentQuality;
                return matchesSearch && matchesQuality;
            });

            if (filtered.length === 0) {
                itemsGrid.innerHTML = "";
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            itemsGrid.innerHTML = filtered.map(item => {
                const qClass = `quality-${item.quality.toLowerCase()}`;
                const badgeClass = `badge-${item.quality.toLowerCase()}`;
                
                const labelBadge = item.inventory_label && item.inventory_label !== "General" 
                    ? `<span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[10px] font-semibold">${item.inventory_label}</span>`
                    : "";

                const coordsHtml = item.coordinates.map(coord => {
                    return `
                        <button onclick="copyCoords(${coord[0]}, ${coord[1]}, this)" 
                                title="Click to copy coordinates"
                                class="px-2 py-1 text-xs font-mono bg-white hover:bg-indigo-50 border border-slate-200 hover:border-indigo-200 text-slate-700 rounded-lg flex items-center justify-between group/tag cursor-pointer transition-all shadow-3xs">
                            <span>${coord[0]}, ${coord[1]}</span>
                            <i class="fa-regular fa-copy ml-1.5 text-[10px] text-slate-400 group-hover/tag:text-indigo-500 transition-colors"></i>
                        </button>
                    `;
                }).join('');

                return `
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col ${qClass} transition-all hover:-translate-y-0.5 hover:shadow-md">
                        <div class="p-4 border-b border-slate-100 bg-gradient-to-b from-slate-50/50 to-white">
                            <div class="flex items-start justify-between gap-2 mb-1.5">
                                <h3 class="font-bold text-slate-900 text-base tracking-tight">${item.display_name}</h3>
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider ${badgeClass}">${item.quality}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                ${labelBadge}
                                <span class="text-slate-400 text-xs font-medium"><i class="fa-solid fa-location-crosshairs mr-1"></i>${item.total_spawns} locations</span>
                            </div>
                        </div>
                        
                        <div class="p-4 flex-1 bg-slate-50/30 max-h-60 overflow-y-auto">
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                ${coordsHtml}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Bootstrapping
        renderGrid();
    </script>
